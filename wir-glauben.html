<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wir glauben – Gemeinde Gottes Rosal</title>
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  :root{
    --navy: #3c2a1e;
    --navy-dark: #2a1d14;
    --blue: #6f4e37;
    --bg: #f6efe3;
    --card-bg: #ffffff;
    --text: #2b2620;
    --muted: #8a8172;
    --border: #e8e2d3;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header.site-header{
    background:#fff;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    gap:12px;
    padding: 14px 40px;
  }
  header.site-header img{
    width:40px; height:40px; object-fit:contain;
  }
  header.site-header .brand-text .name{
    font-weight:700;
    font-size:1.1rem;
    color: var(--navy);
    line-height:1.1;
  }
  header.site-header a{
    text-decoration:none;
    display:flex;
    align-items:center;
    gap:12px;
  }
  main{
    max-width: 720px;
    margin: 60px auto;
    padding: 0 20px;
  }
  .icon{
    font-size:3rem;
    margin-bottom: 10px;
    text-align:center;
  }
  h1{
    color: var(--navy);
    font-size: 1.8rem;
    margin: 0 0 24px;
    text-align:center;
  }
  .content-card{
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 30px 28px;
  }
  p.placeholder{
    color: var(--muted);
    font-size: 1rem;
    line-height:1.7;
    margin: 0;
    text-align:center;
  }
  .back-link{
    display:block;
    text-align:center;
    margin-top: 40px;
    color: var(--blue);
    text-decoration:none;
    font-size:0.92rem;
  }
  .back-link:hover{ text-decoration:underline; }
</style>
</head>
<body>

<header class="site-header">
  <a href="index.html">
    <img src="logo.png" alt="Gemeinde Gottes Rosal Logo">
    <div class="brand-text">
      <div class="name">Gemeinde Gottes Rosal</div>
    </div>
  </a>
</header>

<main>
  <div class="icon">📖</div>
  <h1>Wir glauben</h1>
  <div class="content-card">
    <p class="placeholder">Hier erscheint bald unser Glaubensbekenntnis. Schick mir den Text, und ich füge ihn hier ein.</p>
  </div>

  <a href="index.html" class="back-link">← Zurück zur Startseite</a>
</main>

<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
